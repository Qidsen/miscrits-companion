name: Telegram bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          NOTIFY_KEY: ${{ secrets.NOTIFY_KEY }}
          BOT_USERNAME: ${{ vars.BOT_USERNAME }}
          SITE_URL: https://qidsen.github.io/miscrits-companion/
        run: npx tsx scripts/notify/index.ts
      - name: Save bot state
        run: |
          if [ -n "$(git status --porcelain notify)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add notify
            git commit -m "chore(bot): state"
            git pull --rebase origin main
            git push
          fi
